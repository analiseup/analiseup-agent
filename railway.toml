[build]
builder = "nixpacks"

[deploy]
startCommand = "python analiseup_agent.py"
# Cron do Railway: roda o startCommand todos os dias às 07:00 de Brasília (= 10:00 UTC).
# O script roda a análise de todas as lojas e termina — o serviço dorme até o próximo disparo.
cronSchedule = "0 10 * * *"
# Não reiniciar ao terminar (essencial para serviços cron — sem isso o Railway
# reexecutaria o script em loop)
restartPolicyType = "never"
