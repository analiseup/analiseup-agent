[build]
builder = "nixpacks"

[deploy]
# Roda o agente uma vez ao iniciar (para testes manuais)
# O cron abaixo cuida da execução diária automática
startCommand = "python analiseup_agent.py"

[[crons]]
# Todos os dias às 07:00 horário de Brasília (= 10:00 UTC)
schedule = "0 10 * * *"
command = "python analiseup_agent.py"
